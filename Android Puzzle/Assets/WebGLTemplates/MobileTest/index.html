<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>말랑궤도</title>
<meta name="apple-mobile-web-app-title" content="말랑궤도">
<link rel="icon" type="image/svg+xml" href="mallang-orbit-icon.svg">
<link rel="apple-touch-icon" href="mallang-orbit-icon.png">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf5ff;color:#3d2b5e;font:16px system-ui,sans-serif}
#stage{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#faf5ff;text-align:center;padding:24px;box-sizing:border-box}
progress{width:min(280px,80vw);accent-color:#fca17d}#error{white-space:pre-wrap;overflow-wrap:anywhere;color:#a72d52}
.brand-logo{display:block;width:min(340px,88vw);height:auto;margin-bottom:8px}
</style>
</head>
<body>
<main id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="말랑궤도 퍼즐"></canvas></main>
<div id="loading"><img class="brand-logo" src="mallang-orbit-wordmark.png" width="2172" height="724" alt="말랑궤도"><span>중력을 돌려, 우리 모두 제자리로</span><progress id="progress" value="0" max="1"></progress><span id="error"></span></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
const canvas=document.getElementById('unity-canvas');
const loading=document.getElementById('loading');
// Render above CSS resolution even on 1x monitors: downsampling smooths UI meshes
// and dynamic font edges. Bound the backing buffer on large displays.
function preferredPixelRatio(){
  const rect=canvas.getBoundingClientRect();
  const area=Math.max(1,rect.width*rect.height);
  return Math.max(1,Math.min(3,Math.max(2,window.devicePixelRatio||1),Math.sqrt(6000000/area)));
}
createUnityInstance(canvas,{
  dataUrl:'Build/{{{ DATA_FILENAME }}}',
  frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
  codeUrl:'Build/{{{ CODE_FILENAME }}}',
  streamingAssetsUrl:'StreamingAssets',
  companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
  productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
  productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
  matchWebGLToCanvasSize:true,
  autoSyncPersistentDataPath:true,
  devicePixelRatio:preferredPixelRatio()
},p=>document.getElementById('progress').value=p).then(instance=>{
  window.unityInstance=instance;loading.style.display='none';canvas.focus();
  let resizeFrame=0;
  window.addEventListener('resize',()=>{
    cancelAnimationFrame(resizeFrame);
    resizeFrame=requestAnimationFrame(()=>{instance.Module.devicePixelRatio=preferredPixelRatio();});
  });
}).catch(error=>{
  document.getElementById('error').textContent='실행 실패: '+error+'\nSafari를 최신 버전으로 업데이트하고 다시 시도해 주세요.';
});
</script>
</body>
</html>
