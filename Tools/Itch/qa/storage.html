<!doctype html><meta charset="utf-8"><title>Degul storage compatibility QA</title><style>body{font:16px system-ui}iframe{width:600px;height:800px}</style><h1>Save compatibility QA</h1><button id="inspect">Inspect test storage paths</button><pre id="report"></pre><a href="/legacy/index.html" target="_blank">Open unchanged v1.1 game</a> <a href="/candidate/index.html" target="_blank">Open ranking candidate</a><script>
document.getElementById('inspect').onclick=async()=>{const lines=[];for(const info of await indexedDB.databases()){if(info.name!=='/idbfs')continue;const db=await new Promise((ok,no)=>{const r=indexedDB.open(info.name);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});for(const name of db.objectStoreNames){const tx=db.transaction(name,'readonly');const keys=await new Promise((ok,no)=>{const r=tx.objectStore(name).getAllKeys();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});lines.push({database:info.name,store:name,paths:keys});}db.close();}document.getElementById('report').textContent=JSON.stringify(lines,null,2);};
</script>
<button id="migrate">Copy legacy test save to new upload path</button><button id="check-copy">Verify copied slots and totals</button><pre id="migration"></pre>
<script type="module">
import {preserveItchSave,saveRoot,envelopeSequence} from '/candidate/save-continuity.js';
const old=saveRoot(new URL('/legacy/index.html',location.href).href),next=saveRoot(new URL('/candidate/index.html',location.href).href);
document.getElementById('migrate').onclick=async()=>{try{document.getElementById('migration').textContent=JSON.stringify(await preserveItchSave({url:new URL('/candidate/index.html',location.href).href,legacy:[old]}));}catch(e){document.getElementById('migration').textContent=e.message;}};
document.getElementById('check-copy').onclick=async()=>{const db=await new Promise(ok=>{const r=indexedDB.open('/idbfs');r.onsuccess=()=>ok(r.result);});const tx=db.transaction('FILE_DATA','readonly'),store=tx.objectStore('FILE_DATA');const values=await Promise.all([old,next].map(async root=>{const rows=await Promise.all([0,1].map(slot=>new Promise(ok=>{const r=store.get(root+'/MellowGravity/gravity-progress-'+slot+'.json');r.onsuccess=()=>ok(r.result);})));const latest=rows.filter(r=>envelopeSequence(r)>0).sort((a,b)=>envelopeSequence(b)-envelopeSequence(a))[0];const envelope=latest?JSON.parse(new TextDecoder().decode(latest.contents)):null;const p=envelope?JSON.parse(envelope.payload):null;return {root,sequence:envelope?.sequence,checksum:envelope?.checksum,completed:p?.completed,collection:p?.collection};}));db.close();document.getElementById('migration').textContent=JSON.stringify(values,null,2);};
</script>
